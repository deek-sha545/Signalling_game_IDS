# FULL configuration for the signaling-game suite (~half a day on 8 cores).
# Same keys as project.conf (needed by ddpg.py/sac.py/td3_v3_1.py) + [signaling].
[parameter]
max_episodes = 200
max_ep_steps = 100
lr_a = 0.001
lr_c = 0.002
gamma = 0.95
tau = 0.01
h_def = 32
h_adv = 64
training_mode = old
test_mode = old
memory_capacity = 20000
memory_init = 2000
batch_size = 64
learning_step = 1
learning_count = 1
epsilon_discount = 0.99
epsilon_max = 1.0
test_episodes = 20
test_episodes_ns = 0
max_test_steps = 100
print_step = 10
random_seed = 0
exploration = discrete

[dataset]
data = snort

[double-oracle]
max_iteration = 8
n_trial = 1

[game]
game_type = signaling
gs_formulation = independent_utility
equilibrium_selection = defender_max

[signaling]
# ---- attacker TYPE parameters (the one place where types are defined) ----
types = noisy,stealthy
prior = 0.5,0.5
# noisy: 2x the alert mass, half of it spread uniformly over all alert types
noisy_kind = noisy
noisy_scale = 2.0
noisy_spread = 0.5
# stealthy: half the alert mass, all on the alert type with most false alerts
stealthy_kind = stealthy
stealthy_scale = 0.5
# ---- experiment settings ----
oracle_algo = sac
datasets = fraud,suricata,snort
budgets_fraud = 10,20,30
budgets_suricata = 500,1000,1500
budgets_snort = 500,1000,1500
n_seeds = 10
payoff_episodes = 40
final_eval_episodes = 100
eval_seed = 12345
workers = 8
tag = full
sens_dataset = fraud
sens_budget = 20
sens_separability = 0.0,0.25,0.5,0.75,1.0
sens_seeds = 5
